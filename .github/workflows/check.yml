name: VPN Gate Node Check

on:
  schedule:
    # 避开整点排队风暴，在第 18 分钟触发（如 00:18, 06:18, 12:18, 18:18 UTC）
    - cron: "18 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 供 keepalive 提交使用
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # ⚠️ 2026-10-12 改动：检测 Worker 从 ip.v77580.fun(CheckSocks5) 换成
          #    edgetunnel 自己的 /admin/check —— 客户端走的就是 edgetunnel 的
          #    sstpConnect 实现，用同一个实现检测，判定才和客户端一致。
          #    实测（同一批 40 个节点、同一时刻）：
          #      CheckSocks5 判可用 14/40 = 35%
          #      edgetunnel  判可用 27/40 = 68%  ← 前者误杀了一半能用的节点
          #    需要在仓库 Settings → Secrets 里加一个 EDT_ADMIN = edgetunnel 后台密码
          #    没配的话脚本会自动退回 CheckSocks5，不会报错。
          CHECK_WORKER: "https://ip.v77580.fun/check?sstp=vpn:vpn@"
          ADMIN_URL: "https://ip.v77580.fun"
          ADMIN_PASSWORD: ${{ secrets.EDT_ADMIN }}
          CHECK_CONCURRENCY: "16"
          CHECK_TIMEOUT: "90"
          # ---- 第二阶段：AI 解锁实测（A 方案，2026-10-15）----
          # UNLOCK_TARGET: chatgpt|claude|gemini|off（off=关闭第二阶段，回到只出住宅）
          # UNLOCK_MODE: auto=优先 Worker 隧道实测，不支持则自动退回 ipinfo 信誉过滤；
          #   worker=只用 Worker 实测（需部署补丁版 Worker）；reputation=只用 ipinfo 过滤
          UNLOCK_TARGET: "chatgpt"
          UNLOCK_MODE: "auto"
          UNLOCK_CONCURRENCY: "4"
          UNLOCK_TIMEOUT: "45"


      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keepalive (防 GitHub 60 天无提交自动禁用定时任务)
        if: github.event_name == 'schedule'
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "距上次提交 $age 天"
          if [ "$age" -ge 45 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: $(date -u +%Y-%m-%d)"
            git push
            echo "已提交 keepalive"
          else
            echo "无需 keepalive"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://vip060.github.io/ippp/ (deploy outcome: ${{ steps.deployment.outcome }})"'
